name: OpenDoor approved-feed discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collect approved public feeds
        run: python datasets/fetch_public_feeds.py --sources datasets/source_registry.csv --out datasets/feed_candidates.csv --report datasets/feed_sync_report.json
      - name: Validate candidates
        run: python datasets/validate_catalogue.py datasets/feed_candidates.csv --report datasets/feed_candidates_validation.json || true
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: opendoor-feed-candidates-${{ github.run_number }}
          path: |
            datasets/feed_candidates.csv
            datasets/feed_sync_report.json
            datasets/feed_candidates_validation.json
          if-no-files-found: warn
      - name: Ingest pending candidates to Supabase (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          OPEN_DOOR_SYNC_SECRET: ${{ secrets.OPEN_DOOR_SYNC_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$OPEN_DOOR_SYNC_SECRET" ]; then echo 'Supabase ingest skipped: secrets are not configured.'; exit 0; fi
          python - <<'PY'
          import csv, json
          with open('datasets/feed_candidates.csv', encoding='utf-8-sig') as f:
              records = list(csv.DictReader(f))
          open('/tmp/payload.json','w').write(json.dumps({'records':records}))
          PY
          COUNT=$(python -c "import json; print(len(json.load(open('/tmp/payload.json'))['records']))")
          if [ "$COUNT" -eq 0 ]; then echo 'No approved-feed candidates discovered; nothing to ingest.'; exit 0; fi
          curl --fail-with-body -X POST "$SUPABASE_URL/functions/v1/ingest-candidates" \
            -H "Content-Type: application/json" \
            -H "x-sync-secret: $OPEN_DOOR_SYNC_SECRET" \
            --data-binary @/tmp/payload.json
