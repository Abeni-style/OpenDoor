name: Deploy OpenDoor Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        run: npm install --global supabase

      - name: Check Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          fi

      - name: Deploy OpenDoor Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for function_name in student-assistant submit-feedback create-checkout stripe-webhook ingest-candidates billing-status telegram-intake; do
            echo "Deploying ${function_name}..."
            supabase functions deploy "${function_name}" --project-ref hkhbiujfbysqt1quid
          done
