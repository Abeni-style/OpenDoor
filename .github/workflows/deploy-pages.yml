name: Deploy OpenDoor website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'backend.css'
      - 'pitch-tour.css'
      - 'backend-config.js'
      - 'data.js'
      - 'app.js'
      - 'backend.js'
      - 'pitch-tour.js'
      - 'assets/**'
      - 'locales/**'
      - 'scripts/build_public_site.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build safe public frontend
        run: python scripts/build_public_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
